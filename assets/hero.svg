<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="t d">
  <title id="t">José Henrique</title>
  <desc id="d">Full-Stack Developer com foco em front-end. Trabalhando com Next.js, React e NestJS na ClickBus. Estudando Kotlin e Spring Boot.</desc>

  <defs>
    <linearGradient id="main" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e2f7a"/>
      <stop offset="1" stop-color="#071a4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .label { font-size: 11px; letter-spacing: 2px; fill: #60a5fa; font-weight: 600; }
    .value { font-size: 20px; fill: #ffffff; font-weight: 700; }
    .sub { font-size: 13px; fill: #bfdbfe; }
    .pill { fill: #12295c; stroke: #2563eb; stroke-width: 1; }
    .pilltxt { font-size: 13px; fill: #dbeafe; text-anchor: middle; }
    .card { fill: #0a1f55; stroke: #1e3a8a; stroke-width: 1; }
    .rise { animation: rise .7s cubic-bezier(.2,.8,.2,1) backwards; }
    .d1 { animation-delay: .05s; } .d2 { animation-delay: .2s; }
    .d3 { animation-delay: .35s; } .d4 { animation-delay: .5s; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .dot { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-in-out infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.8); opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .rise, .cursor, .dot { animation: none; } }
  </style>

  <!-- Main card -->
  <g class="rise d1">
    <rect x="20" y="20" width="520" height="300" rx="22" fill="url(#main)" stroke="#1e3a8a"/>
    <rect x="20" y="20" width="520" height="300" rx="22" fill="url(#glow)"/>
    <text x="56" y="100" class="label">FULL-STACK DEVELOPER</text>
    <text x="56" y="152" font-size="46" font-weight="800" fill="#ffffff">José Henrique</text>
    <rect x="56" y="168" width="64" height="4" rx="2" fill="url(#accent)"/>
    <text x="56" y="208" class="mono" font-size="15" fill="#60a5fa">&gt;</text>
    <text x="76" y="208" class="mono" font-size="15" fill="#dbeafe">interfaces rápidas e acessíveis</text>
    <rect x="357" y="195" width="8" height="16" class="cursor" fill="#60a5fa"/>

    <g>
      <rect class="pill" x="56"  y="250" width="102" height="32" rx="16"/><text class="pilltxt" x="107" y="271">TypeScript</text>
      <rect class="pill" x="166" y="250" width="70"  height="32" rx="16"/><text class="pilltxt" x="201" y="271">React</text>
      <rect class="pill" x="244" y="250" width="78"  height="32" rx="16"/><text class="pilltxt" x="283" y="271">Next.js</text>
      <rect class="pill" x="330" y="250" width="70"  height="32" rx="16"/><text class="pilltxt" x="365" y="271">NestJS</text>
      <rect class="pill" x="408" y="250" width="72"  height="32" rx="16"/><text class="pilltxt" x="444" y="271">Flutter</text>
    </g>
  </g>

  <!-- Now card -->
  <g class="rise d2">
    <rect class="card" x="560" y="20" width="320" height="140" rx="22"/>
    <circle class="dot" cx="590" cy="54" r="5" fill="#34d399"/>
    <text x="606" y="58" class="label">AGORA</text>
    <text x="584" y="102" class="value">Next.js · React · NestJS</text>
    <text x="584" y="130" class="sub">Front-end com um pé no back</text>
  </g>

  <!-- Work card -->
  <g class="rise d3">
    <rect class="card" x="560" y="180" width="152" height="140" rx="22"/>
    <text x="584" y="214" class="label">TRABALHO</text>
    <text x="584" y="256" class="value">ClickBus</text>
    <text x="584" y="280" class="sub">multi-tenant</text>
    <text x="584" y="298" class="sub">design system</text>
  </g>

  <!-- Learning card -->
  <g class="rise d4">
    <rect class="card" x="728" y="180" width="152" height="140" rx="22"/>
    <text x="752" y="214" class="label">ESTUDANDO</text>
    <text x="752" y="256" class="value">Kotlin</text>
    <text x="752" y="280" class="sub">Spring Boot</text>
    <text x="752" y="298" class="sub">microsserviços</text>
  </g>
</svg>
